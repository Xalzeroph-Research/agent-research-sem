[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-research-sem"
version = "2.0.0"
description = "Self-Evolving Memory research project on Noetrium"
readme = "README.md"
keywords = ["self-evolving-memory", "agent-research", "noetrium", "minecraft", "reproducibility", "scientific-computing"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["noetrium>=0.44,<0.45"]

[project.urls]
Homepage = "https://github.com/Xalzeroph-Research/agent-research-sem"
Repository = "https://github.com/Xalzeroph-Research/agent-research-sem"
Documentation = "https://github.com/Xalzeroph-Research/agent-research-sem/tree/main/docs"
Issues = "https://github.com/Xalzeroph-Research/agent-research-sem/issues"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
release = ["build>=1.2,<2", "twine>=5,<7"]

[project.scripts]
sem = "projects.sem_paper.cli:main"

[tool.setuptools.packages.find]
include = ["projects*"]


[tool.pytest.ini_options]
pythonpath = [".", "tests"]
testpaths = ["tests"]
